  quote: Preliminary investigations on the clinical samples have shown that optical diagnostics using a combination of ﬂuorimetry
    with diﬀuse reﬂectance NIR or ATR IR spectroscopy results in much better accuracy of the tumor margin detection than each
    of the methods individually.
  claim: Combining fluorimetry with diffuse reflectance NIR or ATR IR spectroscopy improves tumor margin detection accuracy
    compared to single methods.
