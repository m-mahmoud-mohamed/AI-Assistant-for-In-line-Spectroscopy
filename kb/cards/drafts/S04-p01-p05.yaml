  quote: A multispectral ﬁber optic probe has been developed that enables simultaneous analysis of various liquid and solid
    samples using attenuated total reﬂection mid-infrared spectroscopy and ﬂuorimetry.
  claim: A developed fiber optic probe allows simultaneous MIR-ATR and fluorescence analysis of liquid and solid samples.
  scope: process_application
  methods:
  - MIR
  - Fluorescence
  topics:
  - fiber
  - geometry
  - simultaneous_analysis
  - sample_state
  status: draft
