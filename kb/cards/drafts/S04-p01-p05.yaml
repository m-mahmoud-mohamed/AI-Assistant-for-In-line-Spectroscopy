  quote: Considerable progress in this area is associated with the advent of new optical ﬁber materials on the basis of chalcogenide
    glasses and polycrystalline silver halides having suﬃciently high transmittance in diﬀerent intervals of the mid-infrared
    (IR) spectral region (4000−400 cm−1).
  claim: Chalcogenide glasses and polycrystalline silver halides are fiber materials enabling high transmittance in the 4000–400
    cm⁻¹ mid-IR region.
