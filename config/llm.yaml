# LLM profiles. Pipeline stages request a role; the active profile maps the role to models and settings.
#
# Roles: extractor, writer, writer_deep, judge, judge_deep, patcher, classifier, agent, vision, embedder.
# Optional: writer_answer, writer_concept, writer_plan route one report section's writer to its own models
# (missing = writer).
# Legacy names still work: generator = writer, generator_deep = writer_deep, critic = judge, critic_deep = judge_deep
# (the gateway resolves them in both directions, so old profiles and old callers keep working).
# Tier intent: mid = agent, extractor, writer; fast = judge, patcher, classifier; top = writer_deep, judge_deep, vision.
# Keep the judge on another model family than the writer, so the checker does not share the writer's blind spots.
active_profile: ${PRISM_LLM_PROFILE:-openai}

profiles:
  gemini:                                     # native Gemini API (google-genai SDK); set GEMINI_API_KEY and PRISM_LLM_PROFILE=gemini
    adapter: gemini
    base_url: ""                              # the SDK uses the Gemini API endpoint
    api_key_env: GEMINI_API_KEY
    limits: {}                                # none configured: the gateway counts calls locally and retries on 429
    capabilities:                             # re-check with: make probe PROFILE=gemini
      # thinking_levels: the levels the model accepts (the adapter maps a requested level to the nearest listed one).
      # thinking_headroom: tokens added to max_output_tokens per level, because thinking tokens count against that limit.
      gemini-3.8-flash:        &flash {json_schema: true, tools: true, vision: true, thinking_levels: [low, medium, high], thinking_headroom: {low: 1024, medium: 3072, high: 8192, default: 2048}}
      gemini-3.6-flash:        *flash
      gemini-3.5-flash-lite:   &lite  {json_schema: true, tools: true, vision: true, thinking_levels: [low, medium, high], thinking_headroom: {low: 512, medium: 2048, high: 4096, default: 1024}}
      gemini-3.1-flash-lite:   *lite
      gemini-4-argon:          {json_schema: true, tools: true, vision: true, thinking_levels: [low, medium, high], thinking_headroom: {low: 1024, medium: 4096, high: 8192, default: 4096}}
      gemini-3.1-pro-preview:  {json_schema: true, tools: true, vision: true, thinking_levels: [low, high], thinking_headroom: {low: 1024, high: 8192, default: 4096}}
      gemini-embedding-001:    {embedding: true}
    # temperature is left to the provider (null): Google advises the default of 1.0 for Gemini 3+ thinking models.
    # Keys without top-tier quota (free tier) still run deep mode: the flash model with high thinking is the last
    # fallback of the top-tier roles. Fallback keys: GEMINI_API_KEY_2 ... _9 (adapter switches key on a 429).
    roles:
      extractor:      {models: [gemini-3.8-flash, gemini-3.6-flash], reasoning: low, max_tokens: 3000, temperature: null}
      writer:         {models: [gemini-3.8-flash, gemini-3.6-flash], reasoning: low, max_tokens: 1500, temperature: null}
      agent:          {models: [gemini-3.8-flash, gemini-3.6-flash], reasoning: low, max_tokens: 2000, temperature: null}
      judge:          {models: [gemini-3.5-flash-lite, gemini-3.1-flash-lite], reasoning: low, max_tokens: 1500, temperature: null}
      patcher:        {models: [gemini-3.5-flash-lite, gemini-3.1-flash-lite], reasoning: low, max_tokens: 1500, temperature: null}
      classifier:     {models: [gemini-3.5-flash-lite, gemini-3.1-flash-lite], reasoning: low, max_tokens: 300, temperature: null}
      writer_deep:    {models: [gemini-4-argon, gemini-3.1-pro-preview, gemini-3.8-flash], reasoning: high, max_tokens: 8000, temperature: null}
      judge_deep:     {models: [gemini-4-argon, gemini-3.1-pro-preview, gemini-3.8-flash], reasoning: high, max_tokens: 8000, temperature: null}
      vision:         {models: [gemini-4-argon, gemini-3.8-flash], reasoning: low, max_tokens: 4000, temperature: null}
      embedder:       {models: [gemini-embedding-001]}
      transcriber:    {models: [gemini-3.8-flash, gemini-3.6-flash], reasoning: low, max_tokens: 4096, temperature: null}

  openai:                                     # OpenAI API (key in OPENAI_API_KEY); models chosen 2026-10-18
    adapter: openai_compatible
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    limits: {}                                # none configured: the gateway counts calls locally and retries on 429
    capabilities:
      # GPT-5/6 reasoning models: max_completion_tokens, reasoning_effort ("none" = no thinking), provider-default
      # temperature; reasoning tokens count against the limit, so each effort adds headroom.
      gpt-5.4:      &reasoning {json_schema: true, tools: true, vision: true, max_tokens_param: max_completion_tokens,
                                reasoning_effort: true, reasoning_off: none, tools_without_reasoning: true,
                                reasoning_headroom: {none: 0, low: 2048, medium: 4096, high: 8192, default: 2048}}
      gpt-5.4-mini: *reasoning
      gpt-5.4-nano: *reasoning
      gpt-5.5:      *reasoning
      gpt-6.1-sol:  {json_schema: true, tools: true, vision: true, max_tokens_param: max_completion_tokens,
                     reasoning_effort: true, reasoning_off: low,     # no 'none' effort on this model (API, 2026-10-18)
                     reasoning_headroom: {low: 2048, medium: 4096, high: 8192, default: 2048}}
      text-embedding-3-large: {embedding: true}
      text-embedding-3-small: {embedding: true}
    roles:
      extractor:      {models: [gpt-5.4-mini, gpt-5.4], reasoning: "off", max_tokens: 3000, temperature: null}
      writer:         {models: [gpt-5.4, gpt-5.4-mini], reasoning: low, max_tokens: 1500, temperature: null}
      writer_deep:    {models: [gpt-6.1-sol, gpt-5.5], reasoning: high, max_tokens: 6000, temperature: null}
      judge:          {models: [gpt-5.4-mini, gpt-5.4-nano], reasoning: "off", max_tokens: 1500, temperature: null}
      judge_deep:     {models: [gpt-5.5, gpt-5.4], reasoning: high, max_tokens: 6000, temperature: null}
      patcher:        {models: [gpt-5.4-nano, gpt-5.4-mini], reasoning: "off", max_tokens: 1500, temperature: null}
      classifier:     {models: [gpt-5.4-nano, gpt-5.4-mini], reasoning: "off", max_tokens: 300, temperature: null}
      agent:          {models: [gpt-5.4, gpt-5.4-mini], reasoning: low, max_tokens: 2000, temperature: null}
      vision:         {models: [gpt-5.4, gpt-5.5], reasoning: low, max_tokens: 4000, temperature: null}
      embedder:       {models: [text-embedding-3-large, text-embedding-3-small]}
      transcriber:    {models: [gpt-4o-transcribe, whisper-1]}

  project:                                    # the project's own provider; fill in when the key arrives
    adapter: openai_compatible                # or: anthropic | gemini
    base_url: ${PRISM_LLM_BASE_URL:-}
    api_key_env: PRISM_LLM_API_KEY
    limits: {}
    capabilities: {}
    roles: {transcriber: {models: []}}          # set an audio model (e.g. whisper-1) when supported by this provider
                                              # classifier, agent, vision, embedder (judge must be another model family than writer)
