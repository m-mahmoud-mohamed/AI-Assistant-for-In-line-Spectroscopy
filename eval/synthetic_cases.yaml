# Synthetic development enquiries for `make eval` (together with D01–D08: eval/dev_gold.yaml).
# Written from the AFS materials (S01–S04, the method table) and the hard-case types named in the examples document
# (missing information, an enquiry outside the sources, a premise that the sources contradict, other languages) and
# from the brief's own example. They are never derived from the held-out evaluation scenarios.
#
# trap: missing_info | out_of_source | contradicted_premise | multi_stream | aqueous_fluorescence | fiber_window |
#       calibration_transfer | evidence_scope | off_topic | control (no trap: a documented application)
# expect (trap handling, as before):
#   scope:          expected scope-guard label, or a list of acceptable labels
#   status_any_of:  decision statuses that count as correct handling (empty = the scope guard should refuse)
#   premise_flag:   a premise check with verdict CONTRADICTED or UNVERIFIABLE is required
#   screening:      a SCREENING or CONDITIONAL recommendation is expected (low-cost / indicative sensing, screening)
# expect (gold fields; a missing field is not evaluated):
#   status:         the decision status a domain expert expects (status agreement)
#   methods:        acceptable method families of the primary recommendation (any one agrees)
#   techniques:     acceptable probe techniques of the primary recommendation (substring, e.g. "reflection")
#   premises:       expected premise verdicts, one entry per client premise (a list = any of these verdicts);
#                   [] = the enquiry states no premise, so none may be flagged
#   cite:           pages a good answer must cite, as the report cites them ("S01 p.17", "S01 Table 1 (p.6)")
#   streams:        number of process streams that each need their own measurement concept

- id: SYN01
  type: brief_example_partial_coverage
  trap: fiber_window
  text: >-
    We want to monitor soil moisture and hydrocarbon contamination at a remote field site. The location is humid
    and dirty, and the measurement point is far from any building where an analyser could be placed. Can optical
    spectroscopy with fiber probes do this, and what should we try first?
  expect: {scope: IN_SCOPE, status_any_of: [PROVISIONAL, INSUFFICIENT_INFORMATION], premise_flag: false,
           screening: false, status: PROVISIONAL, methods: [NIR], premises: [], cite: [S02 p.7]}

- id: SYN02
  type: process_application
  trap: control
  text: >-
    We coat pellets in a fluidised bed and would like to follow the coating thickness during the process instead
    of taking samples for offline analysis. Which in-line spectroscopic method and probe arrangement would you
    suggest for a first feasibility test?
  expect: {scope: IN_SCOPE, status_any_of: [PROVISIONAL, INSUFFICIENT_INFORMATION], premise_flag: false,
           screening: false, status: PROVISIONAL, methods: [NIR, Raman], premises: [], cite: [S01 p.7]}

