name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    # No API key in CI: tests use fakes and verify-outputs replays the committed cache.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: make setup
      # The supplied AFS materials are not in the repository; kb/ (cards, rules, page text) is. Steps that need the
      # materials run only where they are present (copy them into materials/ to run everything locally).
      - name: Build the knowledge base
        if: hashFiles('materials/S01_Multispectral_Laboratory.pdf') != ''
        run: make ingest
      - name: Lint
        run: .venv/bin/ruff check backend tests scripts eval
      - name: Tests
        run: make test
      - name: Verify committed answers (replay, no key)
        if: hashFiles('outputs/run_manifest.json') != '' && hashFiles('materials/customer_scenarios_for_final_evaluation.txt') != ''
        run: PRISM_REPLAY=1 make verify-outputs

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint
