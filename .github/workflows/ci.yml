name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    # No API key in CI: tests use fakes and verify-outputs replays the committed cache.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: make setup
      - name: Build the knowledge base
        run: make ingest
      - name: Tests
        run: make test
      - name: Verify committed answers (replay, no key)
        if: hashFiles('outputs/run_manifest.json') != ''
        run: PRISM_REPLAY=1 make verify-outputs

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
